name: QA Automation

on:
  push:
    branches: [main]
  pull_request:
  schedule:
    # Nightly full regression across every browser.
    - cron: '0 2 * * *'
  workflow_dispatch:
    inputs:
      execution_mode:
        description: 'Execution mode'
        type: choice
        default: single_env
        options:
          # Test one environment and stop.
          - single_env
          # Test staging, then promote to production and verify there.
          - staging_to_prod
      target_env:
        description: 'Target environment (single_env only; ignored by staging_to_prod)'
        type: choice
        default: staging
        options:
          - staging
          - production
      test_suite:
        description: 'Test suite'
        type: choice
        default: smoke
        options:
          - smoke
          - full
      browser:
        description: 'Playwright browser'
        type: choice
        default: chromium
        options:
          - chromium
          - firefox
          - webkit
          - msedge
          - all

concurrency:
  # One pipeline per branch. PR runs are disposable; a promotion run is not.
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  # ---------------------------------------------------------------------------
  # Every downstream job reads its parameters from here, so there is exactly one
  # place that decides "which environment, which suite, which browsers, and does
  # this run promote".
  #
  # The `verify_*` outputs describe the post-deployment run on production, which
  # is not always the same suite as stage 1: an automatic promotion from a push
  # verifies with smoke, while an operator choosing staging_to_prod verifies with
  # whichever suite they picked.
  # ---------------------------------------------------------------------------
  config:
    name: Resolve run configuration
    runs-on: ubuntu-latest
    outputs:
      environment: ${{ steps.resolve.outputs.environment }}
      karate_env: ${{ steps.resolve.outputs.karate_env }}
      base_url: ${{ steps.resolve.outputs.base_url }}
      suite: ${{ steps.resolve.outputs.suite }}
      karate_test: ${{ steps.resolve.outputs.karate_test }}
      playwright_grep: ${{ steps.resolve.outputs.playwright_grep }}
      browsers: ${{ steps.resolve.outputs.browsers }}
      promote: ${{ steps.resolve.outputs.promote }}
      production_base_url: ${{ steps.resolve.outputs.production_base_url }}
      verify_suite: ${{ steps.resolve.outputs.verify_suite }}
      verify_karate_test: ${{ steps.resolve.outputs.verify_karate_test }}
      verify_grep: ${{ steps.resolve.outputs.verify_grep }}
    steps:
      - name: Resolve execution mode, environment, suite and browsers
        id: resolve
        env:
          # Point these repository variables at the real hosts; the public demo
          # site is the fallback so the pipeline still runs in a fresh fork.
          STAGING_BASE_URL: ${{ vars.STAGING_BASE_URL || 'https://demoqa.com' }}
          PRODUCTION_BASE_URL: ${{ vars.PRODUCTION_BASE_URL || 'https://demoqa.com' }}
          EVENT_NAME: ${{ github.event_name }}
          INPUT_EXECUTION_MODE: ${{ inputs.execution_mode }}
          INPUT_TARGET_ENV: ${{ inputs.target_env }}
          INPUT_TEST_SUITE: ${{ inputs.test_suite }}
          INPUT_BROWSER: ${{ inputs.browser }}
        run: |
          set -euo pipefail

          # smoke/full is expressed two different ways: Karate selects its tag
          # set through the runner class, Playwright through --grep.
          karate_test_for() {
            if [ "$1" = smoke ]; then echo SmokeTest; else echo BookStoreApiTest; fi
          }
          grep_for() {
            if [ "$1" = smoke ]; then echo "--grep @smoke"; else echo ""; fi
          }

          case "$EVENT_NAME" in
            workflow_dispatch)
              MODE="$INPUT_EXECUTION_MODE"
              SUITE="$INPUT_TEST_SUITE"
              BROWSER="$INPUT_BROWSER"
              if [ "$MODE" = staging_to_prod ]; then
                # The pipeline always starts at staging in this mode, so
                # target_env is deliberately ignored.
                ENVIRONMENT=staging
                PROMOTE=true
                # Production is verified with the same suite and browser.
                VERIFY_SUITE="$SUITE"
              else
                ENVIRONMENT="$INPUT_TARGET_ENV"
                PROMOTE=false
                VERIFY_SUITE="$SUITE"
              fi
              ;;
            push)
              # CD: full regression on staging, automatic promotion, smoke on production.
              MODE=staging_to_prod
              ENVIRONMENT=staging; SUITE=full; BROWSER=chromium
              PROMOTE=true; VERIFY_SUITE=smoke
              ;;
            schedule)
              MODE=single_env
              ENVIRONMENT=staging; SUITE=full; BROWSER=all
              PROMOTE=false; VERIFY_SUITE=smoke
              ;;
            *)
              # pull_request: fast gate only.
              MODE=single_env
              ENVIRONMENT=staging; SUITE=smoke; BROWSER=chromium
              PROMOTE=false; VERIFY_SUITE=smoke
              ;;
          esac

          if [ "$ENVIRONMENT" = production ]; then
            BASE_URL="$PRODUCTION_BASE_URL"
          else
            BASE_URL="$STAGING_BASE_URL"
          fi

          if [ "$BROWSER" = all ]; then
            BROWSERS='["chromium","firefox","webkit","msedge"]'
          else
            BROWSERS="[\"$BROWSER\"]"
          fi

          {
            echo "environment=$ENVIRONMENT"
            echo "karate_env=$ENVIRONMENT"
            echo "base_url=$BASE_URL"
            echo "suite=$SUITE"
            echo "karate_test=$(karate_test_for "$SUITE")"
            echo "playwright_grep=$(grep_for "$SUITE")"
            echo "browsers=$BROWSERS"
            echo "promote=$PROMOTE"
            echo "production_base_url=$PRODUCTION_BASE_URL"
            echo "verify_suite=$VERIFY_SUITE"
            echo "verify_karate_test=$(karate_test_for "$VERIFY_SUITE")"
            echo "verify_grep=$(grep_for "$VERIFY_SUITE")"
          } >> "$GITHUB_OUTPUT"

          {
            echo "### Run configuration"
            echo ""
            echo "| Setting | Value |"
            echo "|---|---|"
            echo "| Trigger | $EVENT_NAME |"
            echo "| Execution mode | $MODE |"
            echo "| Environment | $ENVIRONMENT ($BASE_URL) |"
            echo "| Suite | $SUITE |"
            echo "| Browsers | $BROWSERS |"
            echo "| Promote to production | $PROMOTE |"
            if [ "$PROMOTE" = true ]; then
              echo "| Production verification | $VERIFY_SUITE ($PRODUCTION_BASE_URL) |"
            fi
          } >> "$GITHUB_STEP_SUMMARY"

  # ---------------------------------------------------------------------------
  # Stage A - test the selected environment. staging_to_prod always starts here
  # on staging; single_env runs here and stops.
  # ---------------------------------------------------------------------------
  api-tests:
    name: API (Karate) - ${{ needs.config.outputs.environment }} - ${{ needs.config.outputs.suite }}
    needs: config
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: maven
      - name: Run Karate suite
        working-directory: karate
        run: >-
          mvn -B test
          -Dtest=${{ needs.config.outputs.karate_test }}
          "-Dkarate.env=${{ needs.config.outputs.karate_env }}"
          "-DbaseUrl=${{ needs.config.outputs.base_url }}"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: karate-reports-${{ needs.config.outputs.environment }}
          path: karate/target/karate-reports/
          retention-days: 14

  ui-tests:
    name: Web (Playwright) - ${{ needs.config.outputs.environment }} - ${{ matrix.browser }}
    # The web suite exercises the same back end; no point burning runner minutes
    # on browsers if the API contract is already broken.
    needs: [config, api-tests]
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        browser: ${{ fromJSON(needs.config.outputs.browsers) }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: playwright/package-lock.json
      - name: Install dependencies
        working-directory: playwright
        run: npm ci
      - name: Install browsers
        working-directory: playwright
        # Installs the bundled Chromium, Firefox and WebKit builds together with
        # the OS-level libraries the runner needs to launch them headless.
        run: npx playwright install --with-deps
      - name: Install Microsoft Edge
        if: matrix.browser == 'msedge'
        working-directory: playwright
        # Edge is a branded channel rather than a bundled engine, so the command
        # above does not fetch it - it has to be requested by name.
        run: npx playwright install --with-deps msedge
      - name: Run Playwright suite
        working-directory: playwright
        env:
          BASE_URL: ${{ needs.config.outputs.base_url }}
        # `playwright test` has no --channel flag: the msedge project declares
        # `channel: 'msedge'`, so --project stays the single dispatch mechanism.
        run: npx playwright test --project=${{ matrix.browser }} ${{ needs.config.outputs.playwright_grep }}
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: playwright-report-${{ needs.config.outputs.environment }}-${{ matrix.browser }}
          path: playwright/playwright-report/
          retention-days: 14

  # ---------------------------------------------------------------------------
  # Stage B - promotion. Reached only when the whole staging gate is green, and
  # only when the run is a promoting one: a push to main, or an operator who
  # chose staging_to_prod. single_env never gets here.
  # ---------------------------------------------------------------------------
  promote-to-production:
    name: Promote to production
    needs: [config, api-tests, ui-tests]
    if: needs.config.outputs.promote == 'true'
    runs-on: ubuntu-latest
    environment:
      name: production
      url: ${{ needs.config.outputs.production_base_url }}
    steps:
      - uses: actions/checkout@v4
      - name: Deploy to production
        run: |
          set -euo pipefail
          echo "Staging gate green - promoting ${{ github.sha }} to production."
          # Replace with the real deployment command, for example:
          #   ./scripts/deploy.sh production "${{ github.sha }}"

  # ---------------------------------------------------------------------------
  # Stage B, continued - post-deployment verification on production, at both
  # layers, with the browsers stage A used.
  # ---------------------------------------------------------------------------
  production-verify-api:
    name: Verify - API (Karate) - production - ${{ needs.config.outputs.verify_suite }}
    needs: [config, promote-to-production]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: maven
      - name: Run Karate suite against production
        working-directory: karate
        run: >-
          mvn -B test
          -Dtest=${{ needs.config.outputs.verify_karate_test }}
          "-Dkarate.env=production"
          "-DbaseUrl=${{ needs.config.outputs.production_base_url }}"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: karate-reports-production
          path: karate/target/karate-reports/
          retention-days: 14

  production-verify-ui:
    name: Verify - Web (Playwright) - production - ${{ matrix.browser }}
    needs: [config, promote-to-production]
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        browser: ${{ fromJSON(needs.config.outputs.browsers) }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: playwright/package-lock.json
      - name: Install dependencies
        working-directory: playwright
        run: npm ci
      - name: Install browsers
        working-directory: playwright
        run: npx playwright install --with-deps
      - name: Install Microsoft Edge
        if: matrix.browser == 'msedge'
        working-directory: playwright
        run: npx playwright install --with-deps msedge
      - name: Run Playwright suite against production
        working-directory: playwright
        env:
          BASE_URL: ${{ needs.config.outputs.production_base_url }}
        run: npx playwright test --project=${{ matrix.browser }} ${{ needs.config.outputs.verify_grep }}
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: playwright-report-production-${{ matrix.browser }}
          path: playwright/playwright-report/
          retention-days: 14
