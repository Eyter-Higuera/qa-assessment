name: QA Automation

# run-name is evaluated before any job starts, so it can only read the github,
# inputs and vars contexts - no job outputs. The entry stage is therefore taken
# straight from the ref rather than from the config job that derives it.
#
# No SHA appears in any title, because a SHA here can only ever be all forty
# characters. run-name is evaluated before any job starts, and the expression
# language has no substring function - the complete list is contains,
# startsWith, endsWith, format, join, toJSON, fromJSON and hashFiles, plus the
# status checks. There is no substr, no slice, no split; writing one fails the
# run with "Unrecognized function". For the same reason the push arm carries the
# whole commit message rather than its first line.
#
# The short SHA and the commit subject are computed in bash in the config job
# and printed at the top of the run summary, which is the nearest place they
# can actually exist. The Actions list also shows the commit separately.
#
# A step cannot help either. run-name is evaluated once, when the run is created
# and before any job exists, and there is no API to rename a run afterwards - so
# nothing a script computes can ever reach the title. The only mechanism that
# would is a trampoline: a stub workflow on push that dispatches the real one
# with the short SHA as an input. That is not worth it here. It doubles every
# push into two runs, and it makes every real run a workflow_dispatch, which is
# exactly the distinction the resolver below and the eyter_dev promotion guard
# depend on.
#
# So push titles carry the run number: short by construction, unique, and the
# thing the Actions UI links by. The commit is not lost - the list shows its SHA
# in its own column, and the run summary prints the subject and short SHA
# together, both derived in bash where deriving them is possible.
#
# `a && b || c` is GitHub's ternary: && yields its right side when the left is
# truthy, || yields the first truthy operand. Every format() here returns a
# non-empty string, so each branch is truthy and the chain falls through
# correctly to the last arm, nested ternary included.
#
# `inputs.promote == true` compares against a real boolean, which works because
# the inputs context honours the declared type. github.event.inputs.promote is
# the trap: that one is always a string, and 'false' is truthy, so a title built
# from it would claim every manual run promotes.
run-name: >-
  ${{ github.event_name == 'workflow_dispatch'
        && ( inputs.promote == true
               && format('[MANUAL: {0}] - Promote onward from this branch if its tests pass - [API + UI] - {1} on {2}',
                         github.ref_name, inputs.test_suite, inputs.browser)
            || format('[MANUAL: {0}] - [API + UI] - {1} on {2}',
                      github.ref_name, inputs.test_suite, inputs.browser) )
   || github.event_name == 'pull_request'
        && format('[PR #{0}] - [API + UI] - {1}', github.event.pull_request.number, github.event.pull_request.title)
   || format('[{0}: {1}] - [API + UI] - nightly full regression', github.event_name, github.ref_name) }}

# The promotion chain is ONE workflow run, wired with `needs:`:
#
#   config
#     -> 1. dev tests         (eyter_dev -> dev environment)
#       -> promote to release
#         -> 2. release tests (release -> release environment)
#           -> promote to main
#             -> 3. deploy production
#               -> production smoke
#
# The branch you run from picks the ENTRY POINT, and the run continues from
# there: eyter_dev enters at stage 1, release at stage 2, main at stage 3.
# Stages before the entry point are skipped, and the order of everything after
# it is unchanged. Entering at stage 3 deploys - running this workflow from main
# is a deployment, not a dry run.
#
# Because a skipped job normally skips everything that needs it, the stages that
# can be entered directly test `needs.<previous>.result` explicitly instead of
# relying on the default needs-semantics. That is what lets stage 2 run on its
# own when the promotion before it never happened.
#
# `release` and `main` are deliberately NOT push triggers. They used to be, and
# that is what made the stages race: pushing two branches starts two independent
# runs, and each promotion push started a third. Enter those stages by running
# the workflow manually from that branch - to test them, not to promote from
# them. Promotion is bound to eyter_dev and the run fails fast anywhere else.

on:
  # Not `push`. push-pipeline.yml owns that trigger: it computes the commit
  # subject and short SHA, titles a run with them, and calls this workflow
  # through the workflow_call entry below. Its inputs never reach the manual
  # popup, which is why the internal ones live there and not here.
  pull_request:
  schedule:
    # Nightly full regression on the integration environment. Does not promote.
    - cron: '0 2 * * *'
  workflow_dispatch:
    inputs:
      test_suite:
        description: 'Test suite'
        type: choice
        default: smoke
        options:
          - smoke
          - regression
      browser:
        description: 'Playwright browser'
        type: choice
        default: chromium
        options:
          - chromium
          - firefox
          - webkit
          - msedge
          - all browsers
      promote:
        description: 'Promote onward if tests pass (eyter_dev only; fails elsewhere)'
        type: boolean
        default: false
  workflow_call:
    # Same three decisions, plus the one field that says where the run came
    # from. workflow_call inputs are invisible in the UI, so nothing here
    # clutters the Run workflow popup above.
    inputs:
      test_suite:
        type: string
        required: true
      browser:
        type: string
        required: true
      promote:
        type: boolean
        default: false
      origin_event:
        description: 'push when called by push-pipeline.yml; empty otherwise'
        type: string
        default: ''

concurrency:
  # Superseded runs on a branch are cancelled rather than queued behind the one
  # in flight, so a run that wedges cannot block every run after it.
  #
  # The trade-off, deliberately accepted: this can cancel a promotion mid-chain,
  # leaving release advanced and main not. The fast-forward push makes that safe
  # to recover from - re-running promotes the same commit, and a target that has
  # moved on is rejected rather than rewritten.
  group: ${{ github.workflow }}-${{ github.ref_name }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  # ---------------------------------------------------------------------------
  # One place decides where the run starts, what each stage runs, and whether
  # this run is allowed to move a branch or deploy.
  # ---------------------------------------------------------------------------
  config:
    name: Resolve run configuration
    runs-on: ubuntu-latest
    outputs:
      start_stage: ${{ steps.resolve.outputs.start_stage }}
      dev_base_url: ${{ steps.resolve.outputs.dev_base_url }}
      release_base_url: ${{ steps.resolve.outputs.release_base_url }}
      production_base_url: ${{ steps.resolve.outputs.production_base_url }}
      suite: ${{ steps.resolve.outputs.suite }}
      browsers: ${{ steps.resolve.outputs.browsers }}
      release_suite: ${{ steps.resolve.outputs.release_suite }}
      release_browsers: ${{ steps.resolve.outputs.release_browsers }}
      run_chain: ${{ steps.resolve.outputs.run_chain }}
      production_suite: ${{ steps.resolve.outputs.production_suite }}
      short_sha: ${{ steps.resolve.outputs.short_sha }}
    steps:
      - name: Resolve entry point, suites, browsers and promotion
        id: resolve
        env:
          # Point these repository variables at the real hosts; the public demo
          # site is the fallback so the pipeline still runs in a fresh fork.
          DEV_BASE_URL: ${{ vars.DEV_BASE_URL || vars.STAGING_BASE_URL || 'https://demoqa.com' }}
          RELEASE_BASE_URL: ${{ vars.RELEASE_BASE_URL || 'https://demoqa.com' }}
          PRODUCTION_BASE_URL: ${{ vars.PRODUCTION_BASE_URL || 'https://demoqa.com' }}
          EVENT_NAME: ${{ github.event_name }}
          REF_NAME: ${{ github.ref_name }}
          INPUT_TEST_SUITE: ${{ inputs.test_suite }}
          INPUT_BROWSER: ${{ inputs.browser }}
          INPUT_PROMOTE: ${{ inputs.promote }}
          INPUT_ORIGIN_EVENT: ${{ inputs.origin_event }}
          SHA: ${{ github.sha }}
          # Read through the environment rather than interpolated into the script
          # below: a commit message is attacker-controlled text on a public repo,
          # and inlining it into a shell script is the classic injection hole.
          COMMIT_MESSAGE: ${{ github.event.head_commit.message }}
        run: |
          set -euo pipefail

          # --- what this run really is ---------------------------------------
          # A push arrives here as a workflow_call from push-pipeline.yml, so
          # github.event_name says workflow_dispatch. origin_event carries the
          # truth and everything below keys off this instead.
          EFFECTIVE_EVENT="$EVENT_NAME"
          if [ "${INPUT_ORIGIN_EVENT:-}" = push ]; then
            EFFECTIVE_EVENT=push
          fi

          # --- promotion is bound to eyter_dev -------------------------------
          # The chain is defined as starting at eyter_dev, so promoting from
          # anywhere else would move branches from a commit that never passed
          # the dev gate - a feature branch could push itself straight at
          # release. Checked before anything else is resolved so the run fails
          # in seconds rather than after a full suite.
          # Deliberately not conditioned on the event: a hand-dispatched run
          # claiming origin_event=push must not slip past this.
          if [ "${INPUT_PROMOTE:-}" = true ] && [ "$REF_NAME" != eyter_dev ]; then
            echo "::error title=Promotion not allowed from this branch::Promotion is only allowed when triggered from the eyter_dev branch."
            exit 1
          fi

          json_browsers() {
            # Quoted: the sentinel contains a space now.
            if [ "$1" = "all browsers" ]; then
              echo '["chromium","firefox","webkit","msedge"]'
            else
              echo "[\"$1\"]"
            fi
          }

          # --- the branch picks the entry point ------------------------------
          case "$REF_NAME" in
            eyter_dev) START_STAGE=dev ;;
            release)   START_STAGE=release ;;
            main)      START_STAGE=production ;;
            # Feature branches are exercised against dev, like eyter_dev.
            *)         START_STAGE=dev ;;
          esac

          case "$EFFECTIVE_EVENT" in
            push)
              # Only eyter_dev is a push trigger, so this always enters at
              # stage 1 and runs the chain end to end. Coverage widens as the
              # commit approaches production: one browser on the development
              # gate to keep it fast, all four before production.
              SUITE=regression;  BROWSER=chromium
              RELEASE_SUITE=regression; RELEASE_BROWSER="all browsers"
              RUN_CHAIN=true
              ;;
            workflow_dispatch)
              # The operator's choice applies to whichever stage they enter at,
              # so what runs is what they asked for, not a hidden default.
              SUITE="$INPUT_TEST_SUITE";  BROWSER="$INPUT_BROWSER"
              RELEASE_SUITE="$INPUT_TEST_SUITE"; RELEASE_BROWSER="$INPUT_BROWSER"
              # Unticked, the run tests its entry stage and stops: re-running a
              # suite to check something must never move a branch or deploy.
              RUN_CHAIN="$INPUT_PROMOTE"
              ;;
            schedule)
              START_STAGE=dev
              SUITE=regression;  BROWSER="all browsers"
              RELEASE_SUITE=regression; RELEASE_BROWSER="all browsers"
              RUN_CHAIN=false
              ;;
            *)
              # pull_request: fast gate on dev only.
              START_STAGE=dev
              SUITE=smoke; BROWSER=chromium
              RELEASE_SUITE=smoke; RELEASE_BROWSER=chromium
              RUN_CHAIN=false
              ;;
          esac

          # What stage 3 runs against production. A manual run verifies with the
          # suite the operator picked; anything automated confirms the deployment
          # with smoke rather than re-testing the build.
          if [ "$EFFECTIVE_EVENT" = workflow_dispatch ]; then
            PRODUCTION_SUITE="$INPUT_TEST_SUITE"
          else
            PRODUCTION_SUITE=smoke
          fi

          # run-name cannot derive either of these - no split, no substring - so
          # they are cut here, where a shell can do it, and handed to the jobs
          # below through outputs.
          SHORT_SHA=$(echo "$SHA" | cut -c1-7)
          COMMIT_SUBJECT=$(printf '%s' "${COMMIT_MESSAGE:-}" | head -1)

          {
            echo "start_stage=$START_STAGE"
            echo "dev_base_url=$DEV_BASE_URL"
            echo "release_base_url=$RELEASE_BASE_URL"
            echo "production_base_url=$PRODUCTION_BASE_URL"
            echo "suite=$SUITE"
            echo "browsers=$(json_browsers "$BROWSER")"
            echo "release_suite=$RELEASE_SUITE"
            echo "release_browsers=$(json_browsers "$RELEASE_BROWSER")"
            echo "run_chain=$RUN_CHAIN"
            echo "production_suite=$PRODUCTION_SUITE"
            echo "short_sha=$SHORT_SHA"
          } >> "$GITHUB_OUTPUT"

          # --- render what this run will actually do -------------------------
          case "$START_STAGE" in
            dev) START_IDX=1 ;; release) START_IDX=2 ;; production) START_IDX=3 ;;
          esac

          row() {
            # $1 stage number, $2 label, $3 what that stage runs
            if [ "$1" -lt "$START_IDX" ]; then
              echo "| $2 | skipped - before the entry point |"
            elif [ "$1" -eq "$START_IDX" ]; then
              echo "| $2 | **entry point** - $3 |"
            elif [ "$RUN_CHAIN" = true ]; then
              echo "| $2 | $3 |"
            else
              echo "| $2 | skipped - promotion is off |"
            fi
          }

          {
            echo "### Run configuration"
            echo ""
            echo "Suites: **[API + UI]** - Karate then Playwright at every stage."
            if [ -n "$COMMIT_SUBJECT" ]; then
              echo ""
              echo "Commit: \"$COMMIT_SUBJECT\" ($SHORT_SHA)"
            else
              echo ""
              echo "Commit: $SHORT_SHA"
            fi
            echo ""
            if [ "$EFFECTIVE_EVENT" = push ]; then
              echo "Triggered by a **push** to \`$REF_NAME\`, entering at **$START_STAGE**."
            else
              echo "Triggered by \`$EVENT_NAME\` on \`$REF_NAME\`, entering at **$START_STAGE**."
            fi
            echo ""
            echo "The dev -> release -> production chain runs only from \`eyter_dev\`."
            echo "A manual run from \`release\` or \`main\` tests that stage and stops;"
            echo "ticking promote there fails the run before any suite starts."
            if [ "$RUN_CHAIN" != true ]; then
              echo ""
              echo "Promotion is off: this run tests its entry stage and stops."
            fi
            echo ""
            echo "| Stage | Runs |"
            echo "|---|---|"
            row 1 "1. dev" "$SUITE on $(json_browsers "$BROWSER") - $DEV_BASE_URL"
            row 2 "2. release" "$RELEASE_SUITE on $(json_browsers "$RELEASE_BROWSER") - $RELEASE_BASE_URL"
            row 3 "3. production" "deploy, then $PRODUCTION_SUITE - $PRODUCTION_BASE_URL"
          } >> "$GITHUB_STEP_SUMMARY"

  # ---------------------------------------------------------------------------
  # Stage 1 - dev. The entry point for eyter_dev, feature branches and PRs.
  # ---------------------------------------------------------------------------
  dev-tests:
    name: 1. Dev
    needs: config
    if: needs.config.outputs.start_stage == 'dev'
    uses: ./.github/workflows/test-stage.yml
    with:
      environment: dev
      base_url: ${{ needs.config.outputs.dev_base_url }}
      suite: ${{ needs.config.outputs.suite }}
      browsers: ${{ needs.config.outputs.browsers }}

  promote-to-release:
    name: 1b. Promote ${{ needs.config.outputs.short_sha }} to release
    needs: [config, dev-tests]
    # No status function here on purpose: the default needs-semantics already
    # require dev-tests to have succeeded.
    if: >-
      needs.config.outputs.start_stage == 'dev' &&
      needs.config.outputs.run_chain == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    environment:
      name: release
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          # Only needed where branch protection refuses the default token; the
          # chain no longer depends on a push starting the next run.
          token: ${{ secrets.PROMOTION_TOKEN || secrets.GITHUB_TOKEN }}
      - name: Fast-forward release to the tested commit
        env:
          TARGET: release
        run: |
          set -euo pipefail
          echo "Dev stage green - promoting ${{ github.sha }} to $TARGET."
          # Pushing the tested SHA straight at the target ref means the tree that
          # lands is byte-for-byte the tree that passed. Git rejects the push if
          # $TARGET has diverged, which is the right outcome: better a loud
          # failure than a merge commit no stage has ever run against.
          git push origin "${{ github.sha }}:refs/heads/$TARGET"

  # ---------------------------------------------------------------------------
  # Stage 2 - release. Runs either because stage 1 promoted into it, or because
  # the workflow was started from the release branch, which makes it the entry
  # point and leaves the promotion before it skipped.
  # ---------------------------------------------------------------------------
  release-tests:
    name: 2. Release
    needs: [config, promote-to-release]
    if: >-
      !cancelled() &&
      needs.config.result == 'success' &&
      ( needs.config.outputs.start_stage == 'release' ||
        needs.promote-to-release.result == 'success' )
    uses: ./.github/workflows/test-stage.yml
    with:
      environment: release
      base_url: ${{ needs.config.outputs.release_base_url }}
      suite: ${{ needs.config.outputs.release_suite }}
      browsers: ${{ needs.config.outputs.release_browsers }}

  promote-to-main:
    name: 2b. Promote ${{ needs.config.outputs.short_sha }} to main
    needs: [config, release-tests]
    # release-tests is reached by two different paths, so its result is checked
    # explicitly rather than left to the default needs-semantics.
    if: >-
      !cancelled() &&
      needs.config.outputs.run_chain == 'true' &&
      needs.release-tests.result == 'success'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    environment:
      name: production
      url: ${{ needs.config.outputs.production_base_url }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ secrets.PROMOTION_TOKEN || secrets.GITHUB_TOKEN }}
      - name: Fast-forward main to the tested commit
        env:
          TARGET: main
        run: |
          set -euo pipefail
          echo "Release stage green - promoting ${{ github.sha }} to $TARGET."
          git push origin "${{ github.sha }}:refs/heads/$TARGET"

  # ---------------------------------------------------------------------------
  # Stage 3 - production. Reached two ways, and both deploy: the run promoted
  # its way here from release, or it started from main, which makes production
  # its entry point. Running the workflow from main is therefore a deploying
  # action in its own right, with or without the promote box - that box governs
  # promotion between branches, and main has nowhere further to promote to.
  # ---------------------------------------------------------------------------
  deploy-production:
    name: 3. Deploy ${{ needs.config.outputs.short_sha }} to production
    needs: [config, promote-to-main]
    if: >-
      !cancelled() &&
      needs.config.result == 'success' &&
      ( needs.promote-to-main.result == 'success' ||
        needs.config.outputs.start_stage == 'production' )
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Deploy to production
        run: |
          set -euo pipefail
          echo "Deploying ${{ github.sha }} to production."
          # Replace with the real deployment command, for example:
          #   ./scripts/deploy.sh production "${{ github.sha }}"

  production-verify:
    name: 3b. Production ${{ needs.config.outputs.production_suite }}
    needs: [config, deploy-production]
    # Relying on the implicit needs-semantics here silently skipped this job:
    # entering from main leaves promote-to-main skipped, and that skipped state
    # propagates down the chain even though deploy-production itself ran. A
    # status function opts out of that inheritance, so the only thing that
    # decides whether production is verified is whether it was deployed.
    if: >-
      !cancelled() &&
      needs.deploy-production.result == 'success'
    uses: ./.github/workflows/test-stage.yml
    with:
      environment: production
      base_url: ${{ needs.config.outputs.production_base_url }}
      # Whatever the operator selected; smoke for automated runs.
      suite: ${{ needs.config.outputs.production_suite }}
      browsers: ${{ needs.config.outputs.browsers }}

  # ---------------------------------------------------------------------------
  # A run that deployed and then skipped its verification used to finish green in
  # seventeen seconds. This job exists so that cannot happen again: if production
  # was deployed, its verification must have passed for the run to succeed.
  # ---------------------------------------------------------------------------
  pipeline-result:
    name: Pipeline result
    needs: [config, deploy-production, production-verify]
    if: always() && needs.deploy-production.result == 'success'
    runs-on: ubuntu-latest
    steps:
      - name: A deployment must be verified
        env:
          VERIFY: ${{ needs.production-verify.result }}
          SUITE: ${{ needs.config.outputs.production_suite }}
        run: |
          set -euo pipefail
          if [ "$VERIFY" != success ]; then
            echo "::error title=Production deployed but not verified::The $SUITE suite finished as '$VERIFY', not success."
            exit 1
          fi
          echo "Production deployed and verified by the $SUITE suite."
