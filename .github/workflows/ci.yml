name: QA Automation

# The promotion chain is ONE workflow run, wired with `needs:`:
#
#   config
#     -> 1. dev tests         (eyter_dev -> dev environment)
#       -> promote to release
#         -> 2. release tests (release -> release environment)
#           -> promote to main
#             -> 3. deploy production
#               -> production smoke
#
# The branch you run from picks the ENTRY POINT, and the run continues from
# there: eyter_dev enters at stage 1, release at stage 2, main at stage 3.
# Stages before the entry point are skipped, and the order of everything after
# it is unchanged.
#
# Because a skipped job normally skips everything that needs it, the stages that
# can be entered directly test `needs.<previous>.result` explicitly instead of
# relying on the default needs-semantics. That is what lets stage 2 run on its
# own when the promotion before it never happened.
#
# `release` and `main` are deliberately NOT push triggers. They used to be, and
# that is what made the stages race: pushing two branches starts two independent
# runs, and each promotion push started a third. Enter those stages by running
# the workflow manually from that branch.

on:
  push:
    branches: [eyter_dev]
  pull_request:
  schedule:
    # Nightly full regression on the integration environment. Does not promote.
    - cron: '0 2 * * *'
  workflow_dispatch:
    inputs:
      test_suite:
        description: 'Test suite'
        type: choice
        default: smoke
        options:
          - smoke
          - full
      browser:
        description: 'Playwright browser'
        type: choice
        default: chromium
        options:
          - chromium
          - firefox
          - webkit
          - msedge
          - all
      promote:
        description: 'Promote onward from this branch (and deploy, when run from main)'
        type: boolean
        default: false

concurrency:
  # A promotion run moves branches, so never cancel one in flight. Queueing also
  # keeps two chains from promoting different commits at the same time.
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  # ---------------------------------------------------------------------------
  # One place decides where the run starts, what each stage runs, and whether
  # this run is allowed to move a branch or deploy.
  # ---------------------------------------------------------------------------
  config:
    name: Resolve run configuration
    runs-on: ubuntu-latest
    outputs:
      start_stage: ${{ steps.resolve.outputs.start_stage }}
      dev_base_url: ${{ steps.resolve.outputs.dev_base_url }}
      release_base_url: ${{ steps.resolve.outputs.release_base_url }}
      production_base_url: ${{ steps.resolve.outputs.production_base_url }}
      suite: ${{ steps.resolve.outputs.suite }}
      browsers: ${{ steps.resolve.outputs.browsers }}
      release_suite: ${{ steps.resolve.outputs.release_suite }}
      release_browsers: ${{ steps.resolve.outputs.release_browsers }}
      run_chain: ${{ steps.resolve.outputs.run_chain }}
    steps:
      - name: Resolve entry point, suites, browsers and promotion
        id: resolve
        env:
          # Point these repository variables at the real hosts; the public demo
          # site is the fallback so the pipeline still runs in a fresh fork.
          DEV_BASE_URL: ${{ vars.DEV_BASE_URL || vars.STAGING_BASE_URL || 'https://demoqa.com' }}
          RELEASE_BASE_URL: ${{ vars.RELEASE_BASE_URL || 'https://demoqa.com' }}
          PRODUCTION_BASE_URL: ${{ vars.PRODUCTION_BASE_URL || 'https://demoqa.com' }}
          EVENT_NAME: ${{ github.event_name }}
          REF_NAME: ${{ github.ref_name }}
          INPUT_TEST_SUITE: ${{ inputs.test_suite }}
          INPUT_BROWSER: ${{ inputs.browser }}
          INPUT_PROMOTE: ${{ inputs.promote }}
        run: |
          set -euo pipefail

          json_browsers() {
            if [ "$1" = all ]; then
              echo '["chromium","firefox","webkit","msedge"]'
            else
              echo "[\"$1\"]"
            fi
          }

          # --- the branch picks the entry point ------------------------------
          case "$REF_NAME" in
            eyter_dev) START_STAGE=dev ;;
            release)   START_STAGE=release ;;
            main)      START_STAGE=production ;;
            # Feature branches are exercised against dev, like eyter_dev.
            *)         START_STAGE=dev ;;
          esac

          case "$EVENT_NAME" in
            push)
              # Only eyter_dev is a push trigger, so this always enters at
              # stage 1 and runs the chain end to end. Coverage widens as the
              # commit approaches production: one browser on the development
              # gate to keep it fast, all four before production.
              SUITE=full;  BROWSER=chromium
              RELEASE_SUITE=full; RELEASE_BROWSER=all
              RUN_CHAIN=true
              ;;
            workflow_dispatch)
              # The operator's choice applies to whichever stage they enter at,
              # so what runs is what they asked for, not a hidden default.
              SUITE="$INPUT_TEST_SUITE";  BROWSER="$INPUT_BROWSER"
              RELEASE_SUITE="$INPUT_TEST_SUITE"; RELEASE_BROWSER="$INPUT_BROWSER"
              # Unticked, the run tests its entry stage and stops: re-running a
              # suite to check something must never move a branch or deploy.
              RUN_CHAIN="$INPUT_PROMOTE"
              ;;
            schedule)
              START_STAGE=dev
              SUITE=full;  BROWSER=all
              RELEASE_SUITE=full; RELEASE_BROWSER=all
              RUN_CHAIN=false
              ;;
            *)
              # pull_request: fast gate on dev only.
              START_STAGE=dev
              SUITE=smoke; BROWSER=chromium
              RELEASE_SUITE=smoke; RELEASE_BROWSER=chromium
              RUN_CHAIN=false
              ;;
          esac

          {
            echo "start_stage=$START_STAGE"
            echo "dev_base_url=$DEV_BASE_URL"
            echo "release_base_url=$RELEASE_BASE_URL"
            echo "production_base_url=$PRODUCTION_BASE_URL"
            echo "suite=$SUITE"
            echo "browsers=$(json_browsers "$BROWSER")"
            echo "release_suite=$RELEASE_SUITE"
            echo "release_browsers=$(json_browsers "$RELEASE_BROWSER")"
            echo "run_chain=$RUN_CHAIN"
          } >> "$GITHUB_OUTPUT"

          # --- render what this run will actually do -------------------------
          case "$START_STAGE" in
            dev) START_IDX=1 ;; release) START_IDX=2 ;; production) START_IDX=3 ;;
          esac

          row() {
            # $1 stage number, $2 label, $3 what that stage runs
            if [ "$1" -lt "$START_IDX" ]; then
              echo "| $2 | skipped - before the entry point |"
            elif [ "$1" -eq "$START_IDX" ]; then
              echo "| $2 | **entry point** - $3 |"
            elif [ "$RUN_CHAIN" = true ]; then
              echo "| $2 | $3 |"
            else
              echo "| $2 | skipped - promotion is off |"
            fi
          }

          # Entering at production without ticking promote verifies the live site
          # and deliberately deploys nothing.
          if [ "$START_STAGE" = production ] && [ "$RUN_CHAIN" != true ]; then
            PRODUCTION_DESC="smoke only, no deploy - $PRODUCTION_BASE_URL"
          else
            PRODUCTION_DESC="deploy, then smoke - $PRODUCTION_BASE_URL"
          fi

          {
            echo "### Run configuration"
            echo ""
            echo "Triggered by \`$EVENT_NAME\` on \`$REF_NAME\`, entering at **$START_STAGE**."
            if [ "$RUN_CHAIN" != true ]; then
              echo ""
              echo "Promotion is off: this run tests its entry stage and stops."
            fi
            echo ""
            echo "| Stage | Runs |"
            echo "|---|---|"
            row 1 "1. dev" "$SUITE on $(json_browsers "$BROWSER") - $DEV_BASE_URL"
            row 2 "2. release" "$RELEASE_SUITE on $(json_browsers "$RELEASE_BROWSER") - $RELEASE_BASE_URL"
            row 3 "3. production" "$PRODUCTION_DESC"
          } >> "$GITHUB_STEP_SUMMARY"

  # ---------------------------------------------------------------------------
  # Stage 1 - dev. The entry point for eyter_dev, feature branches and PRs.
  # ---------------------------------------------------------------------------
  dev-tests:
    name: 1. Dev
    needs: config
    if: needs.config.outputs.start_stage == 'dev'
    uses: ./.github/workflows/test-stage.yml
    with:
      environment: dev
      base_url: ${{ needs.config.outputs.dev_base_url }}
      suite: ${{ needs.config.outputs.suite }}
      browsers: ${{ needs.config.outputs.browsers }}

  promote-to-release:
    name: 1b. Promote to release
    needs: [config, dev-tests]
    # No status function here on purpose: the default needs-semantics already
    # require dev-tests to have succeeded.
    if: >-
      needs.config.outputs.start_stage == 'dev' &&
      needs.config.outputs.run_chain == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    environment:
      name: release
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          # Only needed where branch protection refuses the default token; the
          # chain no longer depends on a push starting the next run.
          token: ${{ secrets.PROMOTION_TOKEN || secrets.GITHUB_TOKEN }}
      - name: Fast-forward release to the tested commit
        env:
          TARGET: release
        run: |
          set -euo pipefail
          echo "Dev stage green - promoting ${{ github.sha }} to $TARGET."
          # Pushing the tested SHA straight at the target ref means the tree that
          # lands is byte-for-byte the tree that passed. Git rejects the push if
          # $TARGET has diverged, which is the right outcome: better a loud
          # failure than a merge commit no stage has ever run against.
          git push origin "${{ github.sha }}:refs/heads/$TARGET"

  # ---------------------------------------------------------------------------
  # Stage 2 - release. Runs either because stage 1 promoted into it, or because
  # the workflow was started from the release branch, which makes it the entry
  # point and leaves the promotion before it skipped.
  # ---------------------------------------------------------------------------
  release-tests:
    name: 2. Release
    needs: [config, promote-to-release]
    if: >-
      !cancelled() &&
      needs.config.result == 'success' &&
      ( needs.config.outputs.start_stage == 'release' ||
        needs.promote-to-release.result == 'success' )
    uses: ./.github/workflows/test-stage.yml
    with:
      environment: release
      base_url: ${{ needs.config.outputs.release_base_url }}
      suite: ${{ needs.config.outputs.release_suite }}
      browsers: ${{ needs.config.outputs.release_browsers }}

  promote-to-main:
    name: 2b. Promote to main
    needs: [config, release-tests]
    # release-tests is reached by two different paths, so its result is checked
    # explicitly rather than left to the default needs-semantics.
    if: >-
      !cancelled() &&
      needs.config.outputs.run_chain == 'true' &&
      needs.release-tests.result == 'success'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    environment:
      name: production
      url: ${{ needs.config.outputs.production_base_url }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ secrets.PROMOTION_TOKEN || secrets.GITHUB_TOKEN }}
      - name: Fast-forward main to the tested commit
        env:
          TARGET: main
        run: |
          set -euo pipefail
          echo "Release stage green - promoting ${{ github.sha }} to $TARGET."
          git push origin "${{ github.sha }}:refs/heads/$TARGET"

  # ---------------------------------------------------------------------------
  # Stage 3 - production. Deploying is a mutation, so it needs the same explicit
  # permission as moving a branch: either the run promoted its way here, or it
  # started from main with the promote box ticked. Entering from main without
  # ticking it runs the smoke suite against production and nothing else.
  # ---------------------------------------------------------------------------
  deploy-production:
    name: 3. Deploy to production
    needs: [config, promote-to-main]
    if: >-
      !cancelled() &&
      needs.config.result == 'success' &&
      ( needs.promote-to-main.result == 'success' ||
        ( needs.config.outputs.start_stage == 'production' &&
          needs.config.outputs.run_chain == 'true' ) )
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Deploy to production
        run: |
          set -euo pipefail
          echo "Deploying ${{ github.sha }} to production."
          # Replace with the real deployment command, for example:
          #   ./scripts/deploy.sh production "${{ github.sha }}"

  production-smoke:
    name: 3b. Production smoke
    needs: [config, deploy-production]
    # Runs after a deployment, or on its own when main is the entry point and
    # nothing was deployed. Never runs when a deployment was attempted and failed.
    if: >-
      !cancelled() &&
      needs.config.result == 'success' &&
      needs.deploy-production.result != 'failure' &&
      ( needs.deploy-production.result == 'success' ||
        needs.config.outputs.start_stage == 'production' )
    uses: ./.github/workflows/test-stage.yml
    with:
      environment: production
      base_url: ${{ needs.config.outputs.production_base_url }}
      # Always smoke: this confirms the deployment, it does not re-test the build.
      suite: smoke
      browsers: ${{ needs.config.outputs.browsers }}
