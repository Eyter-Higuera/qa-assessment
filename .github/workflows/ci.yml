name: QA Automation

on:
  push:
    branches: [main]
  pull_request:
  schedule:
    # Nightly full regression against the shared environment.
    - cron: '0 2 * * *'

jobs:
  api-tests:
    name: API (Karate)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: maven
      - name: Run Karate suite
        working-directory: karate
        # PRs run the fast gate; the nightly schedule runs everything.
        run: |
          if [ "${{ github.event_name }}" = "schedule" ]; then
            mvn -B test -Dtest=BookStoreApiTest
          else
            mvn -B test -Dtest=SmokeTest
          fi
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: karate-report
          path: karate/target/karate-reports/
          retention-days: 14

  web-tests:
    name: Web (Playwright)
    runs-on: ubuntu-latest
    # The web suite depends on the same back end; no point burning minutes if the
    # API contract is already broken.
    needs: api-tests
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: playwright/package-lock.json
      - name: Install dependencies
        working-directory: playwright
        run: npm ci
      - name: Install browsers
        working-directory: playwright
        run: npx playwright install --with-deps chromium
      - name: Run Playwright suite
        working-directory: playwright
        run: npx playwright test --project=chromium
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: playwright-report
          path: playwright/playwright-report/
          retention-days: 14
