name: Test stage

# One stage of the promotion chain: the API suite, then the web suite against the
# same environment. Called by ci.yml once per environment rather than copied into
# it three times, so the install and reporting steps have a single definition.

on:
  workflow_call:
    inputs:
      environment:
        description: 'Environment name - becomes karate.env and names the artifacts'
        type: string
        required: true
      base_url:
        description: 'Host under test'
        type: string
        required: true
      suite:
        description: 'smoke or regression'
        type: string
        required: true
      browsers:
        description: 'JSON array of Playwright project names, e.g. ["chromium","msedge"]'
        type: string
        required: true

jobs:
  # Cheapest gate first. No browser, no network, no demoqa.com - so when this
  # fails it is unambiguously our code, and it says so in seconds rather than
  # after a suite has spent minutes finding out through the live API.
  unit:
    name: Unit (Vitest) - ${{ inputs.environment }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: playwright/package-lock.json
      - name: Install dependencies
        working-directory: playwright
        run: npm ci
      - name: Run unit tests
        working-directory: playwright
        run: npm run test:unit
      - name: Publish unit results to the run summary
        if: always()
        run: >-
          python3 .github/scripts/junit-summary.py
          "Unit (Vitest) - ${{ inputs.environment }}"
          'playwright/test-results/unit-junit.xml'
          >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: unit-results-${{ inputs.environment }}
          path: playwright/test-results/unit-junit.xml
          retention-days: 14

  api:
    name: API (Karate) - ${{ inputs.environment }} - ${{ inputs.suite }}
    # No point asking a live service anything if the helpers that build the
    # request are broken. A failed unit job skips this by the default
    # needs-semantics.
    needs: unit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v6
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: maven
      - name: Run Karate ${{ inputs.suite }} suite
        working-directory: karate
        # Karate selects its tag set through the runner class: anything that is
        # not 'smoke' runs the whole suite.
        run: >-
          mvn -B test
          -Dtest=${{ inputs.suite == 'smoke' && 'SmokeTest' || 'BookStoreApiTest' }}
          "-Dkarate.env=${{ inputs.environment }}"
          "-DbaseUrl=${{ inputs.base_url }}"
      # Renders on the run summary page, so a failure is readable without
      # downloading and unzipping the report. `always()` because the summary
      # matters most exactly when the step before it failed.
      - name: Publish Karate results to the run summary
        if: always()
        run: >-
          python3 .github/scripts/junit-summary.py
          "Karate - ${{ inputs.environment }} - ${{ inputs.suite }}"
          'karate/target/karate-reports/*.xml'
          >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: karate-reports-${{ inputs.environment }}
          path: karate/target/karate-reports/
          retention-days: 14

  ui:
    name: Web (Playwright) - ${{ inputs.environment }} - ${{ inputs.suite }} - ${{ matrix.browser }}
    # The browsers wait for the API contract. Both suites drive the same back
    # end, so an API failure means the browser legs would be testing a service
    # already known to be broken - and with `all browsers` that is four runners
    # spent to learn nothing. A failed api skips every leg here by the default
    # needs-semantics; no condition is needed to express that.
    #
    # The cost is wall-clock: the stage becomes api + ui rather than the longer
    # of the two, which measured at 66s + 108s against 108s before the browser
    # install was trimmed. Minutes over latency, deliberately.
    needs: api
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        browser: ${{ fromJSON(inputs.browsers) }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: playwright/package-lock.json
      - name: Install dependencies
        working-directory: playwright
        run: npm ci
      # The bare `playwright install` fetched Chromium, Firefox AND WebKit on
      # every leg - 66 seconds to download two engines the leg never launches.
      # Each leg now installs only its own browser, and keeps it between runs.
      - name: Restore the browser binary
        id: browser-cache
        if: matrix.browser != 'msedge'
        uses: actions/cache@v6
        with:
          path: ~/.cache/ms-playwright
          # Keyed on the lockfile, so a Playwright version bump misses the cache
          # rather than launching last version's binary.
          key: playwright-${{ runner.os }}-${{ matrix.browser }}-${{ hashFiles('playwright/package-lock.json') }}
      - name: Install ${{ matrix.browser }}
        if: matrix.browser != 'msedge' && steps.browser-cache.outputs.cache-hit != 'true'
        working-directory: playwright
        run: npx playwright install --with-deps ${{ matrix.browser }}
      - name: Install system libraries for the cached ${{ matrix.browser }}
        if: matrix.browser != 'msedge' && steps.browser-cache.outputs.cache-hit == 'true'
        working-directory: playwright
        # The binary came from the cache; the apt packages it links against did
        # not, and they live outside the cached directory.
        run: npx playwright install-deps ${{ matrix.browser }}
      - name: Install Microsoft Edge
        if: matrix.browser == 'msedge'
        working-directory: playwright
        # Edge is a branded channel, not a bundled engine: it installs as a
        # system package outside ~/.cache/ms-playwright, so there is nothing for
        # the cache above to hold and it is fetched every run.
        run: npx playwright install --with-deps msedge
      - name: Run Playwright ${{ inputs.suite }} suite
        working-directory: playwright
        env:
          BASE_URL: ${{ inputs.base_url }}
        # `playwright test` has no --channel flag: the msedge project declares
        # `channel: 'msedge'`, so --project stays the single dispatch mechanism.
        run: >-
          npx playwright test --project=${{ matrix.browser }}
          ${{ inputs.suite == 'smoke' && '--grep @smoke' || '' }}
      - name: Publish Playwright results to the run summary
        if: always()
        run: >-
          python3 .github/scripts/junit-summary.py
          "Playwright - ${{ inputs.environment }} - ${{ inputs.suite }} - ${{ matrix.browser }}"
          'playwright/test-results/junit.xml'
          >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: playwright-report-${{ inputs.environment }}-${{ matrix.browser }}
          path: playwright/playwright-report/
          retention-days: 14
